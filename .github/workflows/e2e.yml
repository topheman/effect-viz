name: E2E

# The suite is slow and depends on StackBlitz, so it runs only on request:
# adding the `e2e` label to a PR, a manual run, or a production deployment.
on:
  pull_request:
    types: [labeled]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'e2e') ||
      (github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Production') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test a build
        if: github.event_name != 'deployment_status'
        run: npm run e2e

      # The production domain, not the event's per-deployment URL, which
      # Vercel's deployment protection puts behind a login.
      - name: Test the production deployment
        if: github.event_name == 'deployment_status'
        run: npx playwright test
        env:
          E2E_BASE_URL: https://effect-viz.vercel.app

      # Kept on green runs too: it holds the traces of flaky tests.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
