name: E2E

# The suite is slow and depends on StackBlitz, so it runs only on the `e2e`
# label, a manual run, a production deployment, and PRs whose base is not
# `master`, such as a migration branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

env:
  # `prepare` installs the Git hook dispatcher, which CI has no use for.
  VP_GIT_HOOKS: 0

jobs:
  e2e:
    if: >-
      (github.event_name == 'pull_request' &&
        (github.event.label.name == 'e2e' ||
          (github.event.action != 'labeled' && github.base_ref != 'master'))) ||
      (github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Production') ||
      github.event_name == 'workflow_dispatch'
    # At job level, so an event that skips the job cancels nothing. A push
    # cancels its PR's previous run; other runs each get their own group.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || format('e2e-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The vp version comes from the `vite-plus` catalog entry in pnpm-workspace.yaml,
      # the pnpm version from `devEngines.packageManager` in package.json.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".nvmrc"
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Test a build
        if: github.event_name != 'deployment_status'
        run: pnpm run e2e

      # The production domain, not the event's per-deployment URL, which
      # Vercel's deployment protection puts behind a login.
      - name: Test the production deployment
        if: github.event_name == 'deployment_status'
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: https://effect-viz.vercel.app

      # Kept on green runs too: it holds the traces of flaky tests.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
