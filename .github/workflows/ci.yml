name: CI

on: [push, pull_request]

env:
  # `prepare` installs the Git hook dispatcher, which CI has no use for.
  VP_GIT_HOOKS: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The vp version comes from the `vite-plus` catalog entry in pnpm-workspace.yaml,
      # the pnpm version from `devEngines.packageManager` in package.json.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: ".nvmrc"
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Check (format, lint, types)
        run: vp check

      - name: Effect diagnostics
        run: pnpm run typecheck:effect

      - name: Testing
        run: pnpm run test

      - name: Building
        run: pnpm run build
