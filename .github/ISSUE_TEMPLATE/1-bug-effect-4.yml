name: Bug — Effect 4 (effect-viz.vercel.app)
description: Report a bug in the Effect 4 app.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The program you ran, if the bug depends on it.
      render: typescript
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 142, macOS
